# gsplat 1.6 (unreleased) for SplatWork for Windows' "cu128" runtime profile: PyTorch 2.7.1 + CUDA 12.8, RTX 20 →
# RTX 50 series. The Windows twin of the gsplat-wheel job in splat-worker-flatpak.yml, built from the same pin
# (linux/flatpak/gsplat-pin.env) with the CUDA 12.8 toolkit and MSVC; no GPU is needed to compile.
#
# The wheel is cached under a key derived from the pin, so it compiles once per pin. The Pages job in
# splat-worker-flatpak.yml restores that cache and publishes the wheel next to the Linux one at
# https://benevision.github.io/SplatWork/wheels/ (pip picks the win_amd64 file by its platform tag).
name: gsplat Windows wheel

on:
  push:
    branches: [main, "claude/windows-app-*"]
    paths: ["linux/flatpak/gsplat-pin.env", ".github/workflows/gsplat-windows-wheel.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gsplat-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    # Visual Studio 2022: windows-latest now has VS 2026 (MSVC 14.51), whose headers crash CUDA 12.8's cudafe++
    runs-on: windows-2022
    timeout-minutes: 355   # a hosted job may run 6 hours
    steps:
      - uses: actions/checkout@v5
      - name: Read pin
        id: pin
        shell: bash
        run: |
          grep -v '^#' linux/flatpak/gsplat-pin.env | sed '/^$/d' >> "$GITHUB_OUTPUT"
          # hashes the CRLF checkout; the Pages job in splat-worker-flatpak.yml computes the same key on Linux
          echo "key=gsplat-win-$(sha256sum linux/flatpak/gsplat-pin.env | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache wheel
        id: cache
        uses: actions/cache@v4
        with:
          path: wheels-win
          key: ${{ steps.pin.outputs.key }}
          enableCrossOsArchive: true   # restored on Linux by the Pages job
      - name: Use a wheel attached to a GitHub Release
        id: release
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels-win
          tag="gsplat-${{ steps.pin.outputs.GSPLAT_VERSION }}-${{ steps.pin.outputs.CUDA_TAG }}"
          if gh release download "$tag" --repo "${{ github.repository }}" --pattern "gsplat-*win_amd64.whl" --dir wheels-win 2>/dev/null; then
            ls -la wheels-win; echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no release $tag with a Windows wheel: compiling"; echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: CUDA toolkit
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "thrust", "nvtx", "nvrtc_dev", "visual_studio_integration", "cublas_dev", "cusparse_dev", "cusolver_dev", "curand_dev", "cufft_dev"]'
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        with:
          python-version: "3.10"   # the worker's GPU runtime is CPython 3.10
      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        with:
          arch: x64
      - name: Get gsplat at the pinned commit
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools ninja numpy
          python -m pip install "torch==${{ steps.pin.outputs.TORCH_VERSION }}" --index-url https://download.pytorch.org/whl/${{ steps.pin.outputs.CUDA_TAG }}
          git config --global core.longpaths true
          # a short build folder: MSVC and nvcc still hit the 260-character path limit in deep object paths
          git clone --recursive https://github.com/nerfstudio-project/gsplat.git /c/g
          cd /c/g
          git checkout ${{ steps.pin.outputs.GSPLAT_COMMIT }}
          git submodule update --init --recursive
          TAG="pt$(echo ${{ steps.pin.outputs.TORCH_VERSION }} | cut -d. -f1,2 | tr -d .)${{ steps.pin.outputs.CUDA_TAG }}"
          sed -i "s/^__version__ = .*/__version__ = \"${{ steps.pin.outputs.GSPLAT_VERSION }}+${TAG}\"/" gsplat/version.py
          tail -1 gsplat/version.py
          # same upstream fix as on Linux: host-compiled Utils.cpp uses nvcc's two-argument cudaEventCreate
          sed -i -E 's/cudaEventCreate\(([^,()]+), *cudaEventDisableTiming\)/cudaEventCreateWithFlags(\1, cudaEventDisableTiming)/g' gsplat/cuda/csrc/*.cpp
          grep -c cudaEventCreateWithFlags gsplat/cuda/csrc/Utils.cpp || true
          # MSVC only: std::isfinite resolves to the host-only template from MSVC's <cmath> inside a __device__
          # function (Cameras.cuh). |x| <= FLT_MAX is false for NaN and ±inf, and works in device code everywhere.
          sed -i -E 's/std::isfinite\(([^()]+)\)/(fabsf(\1) <= 3.402823466e+38f)/g' gsplat/cuda/include/Cameras.cuh
          grep -n "3.402823466e+38f" gsplat/cuda/include/Cameras.cuh
          ! grep -rn "std::isfinite" gsplat/cuda/include gsplat/cuda/csrc --exclude-dir=third_party
          # MSVC only: its std::array<T, 0>::operator[] isn't constexpr, so the degree-0 instance of the L1+ SH
          # backward kernel can't index it in device code. A plain array of at least one slot behaves the same.
          sed -i -E 's/std::array<opmath_t, MAX_K> acc\{\};/opmath_t acc[MAX_K > 0 ? MAX_K : 1] = {};/; s/acc\.data\(\)/acc/' gsplat/cuda/csrc/SphericalHarmonicsL1PlusCUDA.cu
          grep -n "opmath_t acc\[" gsplat/cuda/csrc/SphericalHarmonicsL1PlusCUDA.cu
          # MSVC has no __builtin_clzll (host code): ceil(log2(x)) = bit length of x - 1
          sed -i -E 's/return 64u - static_cast<uint32_t>\(__builtin_clzll\(x - 1\)\);/uint32_t n = 0; for(uint64_t v = x - 1; v != 0; v >>= 1) { ++n; } return n;/' gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchBwd.cu
          ! grep -rn "__builtin_clz" gsplat/cuda/csrc --include=*.cu --include=*.cpp
          # Windows link: torch_cuda.dll instantiates at::cuda::cub::radix_sort_pairs_impl but doesn't export it (Linux
          # links it anyway), so the batch-replay sort calls cub directly, as IntersectTile.cu and SparseTileLayout.cu do
          F=gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchBwd.cu
          perl -0pi -e 's/at::cuda::cub::radix_sort_pairs<int64_t, int32_t>\(\s*([^,]+),\s*([^,]+),\s*([^,]+),\s*([^,]+),\s*(total_batches),\s*\/\*descending=\*\/false,\s*\/\*begin_bit=\*\/0,\s*\/\*end_bit=\*\/(static_cast<int64_t>\(total_bits == 0 \? 1u : total_bits\))\s*\);/CUB_WRAPPER(cub::DeviceRadixSort::SortPairs, $1, $2, $3, $4, $5, 0, static_cast<int>($6), at::cuda::getCurrentCUDAStream());/s; s/(#\s*include <ATen\/cuda\/cub.h>\n)/$1#    include <c10\/cuda\/CUDACachingAllocator.h>\n#    include <cub\/cub.cuh>\n/' $F
          grep -n "CUB_WRAPPER(cub::DeviceRadixSort::SortPairs" $F
          ! grep -n "at::cuda::cub::radix_sort_pairs" $F
          # the definition says `const bool fwd_only` where the header (not included by this file) says `bool`; make
          # them identical so both sides refer to the same symbol
          F=gsplat/cuda/csrc/RasterizeToPixelsFromWorld3DGSParallelBatchFwd.cu
          sed -i -E 's/^(\s*)const bool fwd_only,/\1bool fwd_only,/' $F
          ! grep -n "const bool fwd_only" $F
      # Resumable build: one compile of every file takes about 6 hours on a 4-core runner, longer than a job may run.
      # The object files (C:\g\build) are cached even when the build fails or runs out of time, and the next run
      # reuses them. Ninja rebuilds an object when an input is newer, and a fresh clone makes every input new, so
      # sources whose content matches the cached build's (build\srchash.txt) and the pinned toolchain headers
      # (torch, CUDA) get an old timestamp. Changed sources keep their new one and are recompiled.
      - name: Restore compiled objects
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: C:\g\build
          key: ${{ steps.pin.outputs.key }}-obj-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.pin.outputs.key }}-obj-
      - name: Reuse unchanged objects
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OLD=2001-01-01
          TORCH_INC=$(python -c "import os, torch; print(os.path.join(os.path.dirname(torch.__file__), 'include'))")
          find "$(cygpath -u "$TORCH_INC")" "$(cygpath -u "$CUDA_PATH")/include" -type f -exec touch -d $OLD {} +
          cd /c/g
          if [ -f build/srchash.txt ]; then
            same=$( (sha256sum -c build/srchash.txt 2>/dev/null || true) | sed -n 's/: OK$//p')
            [ -n "$same" ] && printf '%s\n' "$same" | xargs -d '\n' touch -d $OLD
            echo "reusing objects: $(find build -name '*.obj' | wc -l), unchanged sources: $(printf '%s\n' "$same" | grep -c . || true)"
            (sha256sum -c build/srchash.txt 2>/dev/null || true) | grep -v ': OK$' || true
          else
            echo "no cached objects: full build"
          fi
      # Built from PowerShell, not Git Bash: Git's own link.exe in /usr/bin would shadow MSVC's linker.
      - name: Build gsplat wheel
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        timeout-minutes: 320   # leaves time to save the objects for the next run
        shell: pwsh
        working-directory: C:\g
        env:
          # RTX 20 (7.5), 30 (8.6), 40 (8.9), 50 (12.0) + PTX for newer cards. The Linux wheel also has the data-centre
          # A100 (8.0) and H100 (9.0); leaving them out cuts a third of the Windows compile time.
          TORCH_CUDA_ARCH_LIST: "7.5;8.6;8.9;12.0+PTX"
          MAX_JOBS: "4"
          BUILD_EXPERIMENTAL: "0"
          DISTUTILS_USE_SDK: "1"
          # the runner's Visual Studio can be newer than CUDA 12.8 officially lists
          NVCC_APPEND_FLAGS: "-allow-unsupported-compiler"
        run: |
          nvcc --version
          (Get-Command cl).Source; (Get-Command link).Source
          python -m pip wheel -v --no-deps --no-build-isolation -w "$env:GITHUB_WORKSPACE\wheels-win" . *>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\gsplat-build.log" |
            Select-String -Pattern '^\s*\[\d+/\d+\]|error|FAILED|Successfully built' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(400, $_.Line.Length)) }
          if (-not (Get-ChildItem "$env:GITHUB_WORKSPACE\wheels-win\gsplat-*win_amd64.whl" -ErrorAction SilentlyContinue)) {
            # link diagnostics: what the objects define for the kernels the linker reports missing
            Get-ChildItem C:\g\build -Recurse -Filter RasterizeToPixelsFromWorld3DGSParallelBatch*.obj | ForEach-Object {
              "== $($_.Name)"; dumpbin /symbols $_.FullName | Select-String 'launch_rasterize_to_pixels_from_world_3dgs_parallel_batch|radix_sort' |
                ForEach-Object { $_.Line.Substring(0, [Math]::Min(600, $_.Line.Length)) } }
            exit 1
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE\wheels-win"
      - name: Keep only up-to-date objects
        if: always() && steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        shell: bash
        run: |
          taskkill //F //T //IM ninja.exe 2>/dev/null || true
          taskkill //F //IM nvcc.exe //IM cicc.exe //IM ptxas.exe //IM cl.exe 2>/dev/null || true
          cd /c/g
          [ -d build ] || exit 0
          # an object ninja still considers out of date (stale, half-written when the time ran out, or never logged)
          # must not look fresh in the next run
          for d in $(find build -name build.ninja -printf '%h\n'); do
            ninja -C "$d" -n -d explain 2>&1 | grep '^ninja explain' | grep -oiE '[a-z]:/[^ ]+\.obj' | sort -u > stale.txt || true
            echo "$d: $(wc -l < stale.txt) objects out of date"
            xargs -r -d '\n' rm -f < stale.txt
          done
          find gsplat/cuda -type f | sort | xargs -d '\n' sha256sum > build/srchash.txt
          echo "saving $(find build -name '*.obj' | wc -l) objects, $(du -sh build | cut -f1)"
      - name: Save compiled objects
        if: always() && steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\g\build
          key: ${{ steps.pin.outputs.key }}-obj-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check the wheel imports (no GPU here, so only the module and its extension load)
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.found != 'true'
        shell: bash
        run: |
          # with its dependencies (rich, jaxtyping …); torch is already the pinned cu128 build
          python -m pip install wheels-win/gsplat-*win_amd64.whl
          # the compiled extension itself must load (not gsplat's fallback that compiles it on first use)
          cd "$RUNNER_TEMP"
          python -c "import torch, gsplat.csrc as C; print('extension', C.__file__, len(dir(C)), 'symbols')"
          python -c "import gsplat; print('gsplat', gsplat.__version__)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gsplat-windows
          path: |
            wheels-win
            gsplat-build.log
